<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · WA Group Logger</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/login.js"></script>
</head>
<body>
  <main class="login">
    <div class="card">
      <div class="brand"><span class="dot"></span>WA Group Logger</div>
      <form id="emailForm" novalidate>
        <h1>Sign in</h1>
        <p class="muted small">We'll email you a one-time code. Only authorised admins can sign in.</p>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required autofocus>
        <button class="btn primary full" type="submit" id="sendBtn">Send code</button>
        <p class="small"><button type="button" class="btn link" id="haveCodeBtn">I already have a code</button></p>
      </form>
      <form id="codeForm" class="hidden" novalidate>
        <h1>Enter your code</h1>
        <p class="muted small">Sent to <b id="sentTo"></b>. It expires in 10 minutes.</p>
        <label for="code">6-digit code</label>
        <input id="code" name="code" class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="\d{6}" required>
        <button class="btn primary full" type="submit" id="verifyBtn">Sign in</button>
        <p class="small"><button type="button" class="btn link" id="resendBtn">Resend code</button> · <button type="button" class="btn link" id="backBtn">Use a different email</button></p>
      </form>
      <p class="error" id="error" role="alert" aria-live="assertive"></p>
    </div>
  </main>
</body>
</html>
